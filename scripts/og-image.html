<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(circle at 85% 110%, rgba(198, 244, 50, 0.12) 0%, transparent 55%),
      radial-gradient(circle at 10% -10%, rgba(198, 244, 50, 0.08) 0%, transparent 50%),
      #0a0a0a;
    display: grid;
    grid-template-columns: 380px 1fr;
    align-items: center;
    padding: 56px;
    gap: 48px;
    position: relative;
  }

  /* angolo decorativo */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 6px;
    height: 100%;
    background: #C6F432;
  }

  /* QUADRATO LOGO "R" */
  .logo-box {
    width: 320px;
    height: 320px;
    background: #C6F432;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 20px 60px rgba(198, 244, 50, 0.25),
      0 0 0 1px rgba(198, 244, 50, 0.3);
    position: relative;
  }
  .logo-box .r {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 280px;
    color: #0a0a0a;
    line-height: 1;
    margin-top: -16px;
    letter-spacing: -8px;
  }
  .logo-box .tm {
    position: absolute;
    top: 36px;
    right: 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #0a0a0a;
    opacity: 0.55;
  }

  /* SIDE TESTO */
  .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #C6F432;
    text-transform: uppercase;
  }
  h1 {
    font-size: 64px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: #ffffff;
  }
  h1 .accent {
    color: #C6F432;
  }
  .formats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }
  .pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 20px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .footer {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: #C6F432;
    border-radius: 50%;
    box-shadow: 0 0 12px #C6F432;
  }
  .footer .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <span class="tm">&trade;</span>
      <span class="r">R</span>
    </div>

    <div class="text">
      <div class="brand">Ripam Studio Craft</div>
      <h1>Materiali didattici <span class="accent">AI</span><br/>per concorsi pubblici</h1>

      <div class="formats">
        <span class="pill">🎧 Podcast</span>
        <span class="pill">🎙️ Audio</span>
        <span class="pill">🎥 Video</span>
        <span class="pill">📄 Report</span>
        <span class="pill">📚 Manuali</span>
        <span class="pill">🎯 Simulatori</span>
      </div>

      <div class="footer">
        <span class="dot"></span>
        <span class="label">CONSEGNATI IN 24H · PRIMO EP1 GRATIS</span>
      </div>
    </div>
  </div>
</body>
</html>
